[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ariadns"
version = "1.0.0"
description = "Automated Domain OSINT & Pivoting Engine"
authors = [{ name = "Ariadns Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dnspython>=2.6.0",
    "httpx>=0.27.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "mcp>=1.0.0",
]

[project.scripts]
ariadns = "ariadns.interfaces.cli:main"
ariadns-mcp = "ariadns.interfaces.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
